name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

job:
  test: 
    runs-on: ubuntu-latest

    steps:
      - name: checkout the repository
        uses: actions/checkout@v7

      - name: set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: run test
        run: pytest -v
      
